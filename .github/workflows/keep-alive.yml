# Mantiene despierta la API de Render (plan free).
#
# Render apaga el servicio tras 15 minutos sin tráfico, y la primera visita
# después espera hasta ~60 s a que el contenedor arranque. Un ping cada 5 minutos
# deja margen aunque el cron de GitHub se retrase unos minutos.
#
# El ping va DIRECTO a Render, no a través de Vercel: el rewrite /api/* de Vercel
# podría contestar desde su caché y el servidor se dormiría igual. /api/health
# no toca la base de datos ni TCGdex (ver SaludController): es el ping más barato.
#
# Coste asumido: el servicio queda encendido todo el mes (~744 de las 750 h
# gratuitas de Render). El repo es público, así que los minutos de Actions no
# cuentan.
#
# Ojo: GitHub desactiva los workflows programados de un repo público tras 60 días
# sin actividad. Si eso pasa, se reactiva desde la pestaña Actions.

name: keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping a /api/health en Render
        # Si el servicio estaba dormido, el primer intento espera al arranque
        # (hasta 90 s) y los reintentos cubren los 502/503 del proxy de Render
        run: >
          curl --fail --silent --show-error
          --max-time 90
          --retry 3 --retry-delay 10 --retry-all-errors
          https://poketrade-api-3nwm.onrender.com/api/health
