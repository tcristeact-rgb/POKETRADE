<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{var d=document.documentElement,s=localStorage,h=document.head;if(s.getItem('tema')==='oscuro')d.setAttribute('data-tema','oscuro');var p=location.pathname.split('/')[1]||'',pre=p.length===2&&p!=='es',raiz=pre||p===''||p==='pages'||p.slice(-5)==='.html',i=pre?p:(s.getItem('idioma')||'es');if(raiz&&!pre&&i!=='es'){location.replace('/'+i+location.pathname+location.search);}d.lang=i;if(i!=='es'){d.classList.add('i18n-pendiente');setTimeout(function(){d.classList.remove('i18n-pendiente');},1500);}function pista(r,u,c){var l=document.createElement('link');l.rel=r;l.href=u;if(c)l.crossOrigin='';h.appendChild(l);}pista('modulepreload',(location.pathname.indexOf('/pages/')>-1?'../':'')+'js/i18n/'+i+'.js');if(!/^(localhost|127\.)/.test(location.hostname))pista('preconnect','https://poketrade-api-3nwm.onrender.com',1);}catch(err){}</script>
    <title data-i18n="meta.verificar.title">Verificar correo - PokeTrade</title>
    <meta name="description" data-i18n-attr="content:meta.verificar.desc" content="Introduce el código que te hemos enviado por correo para verificar tu cuenta de PokeTrade." />
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="stylesheet" href="../css/estilos.css">

    <!-- Pistas de carga. El núcleo de módulos se descubre en cascada (header.js
         → auth.js → config.js) y cada nivel cuesta un ida y vuelta entero: esto
         los baja todos a la vez. El diccionario del idioma lo añade el script de
         arriba, que es el único que sabe cuál es.

         La fuente NO se precarga a propósito: son 61 KB que le robarían ancho de
         banda al CSS, que es lo único que bloquea el pintado. Y no hace falta —
         con font-display: swap el texto se lee desde el primer instante y la
         fuente entra cuando llega. Medido: precargarla retrasaba el primer
         pintado 130 ms. -->
    <link rel="modulepreload" href="../js/i18n.js">
    <link rel="modulepreload" href="../js/auth.js">
    <link rel="modulepreload" href="../js/config.js">
    <link rel="modulepreload" href="../js/utils.js">
    <link rel="modulepreload" href="../js/seo.js">
    <link rel="modulepreload" href="../js/espera.js">
</head>
<body>
    <div id="app-header"></div>

    <main>
        <div class="formulario-contenedor">
            <h1 data-i18n="verificar.titulo">Verifica tu correo</h1>
            <!-- Con ?motivo=login: el usuario intentó entrar con una cuenta sin
                 verificar. Sin él: acaba de registrarse. -->
            <p id="aviso-motivo" class="aviso-motivo" role="status" hidden data-i18n="verificar.motivoLogin">
                Tu cuenta aún no está verificada. Introduce el código que te enviamos por correo para poder entrar.
            </p>
            <p class="formulario-pie formulario-intro" data-i18n="verificar.intro">
                Te hemos enviado un código de 6 dígitos. Escríbelo aquí para activar tu cuenta.
            </p>
            <p id="error-mensaje" class="error-texto" role="alert" aria-live="assertive"></p>
            <p id="aviso-reenvio" class="alerta exito" role="status" hidden></p>

            <form id="form-verificar" novalidate>
                <div class="formulario-grupo">
                    <label for="email" data-i18n="auth.email">Email</label>
                    <input type="email" id="email" name="email"
                           data-i18n-attr="placeholder:auth.emailPlaceholder" placeholder="tu@email.com"
                           required autocomplete="email" />
                </div>

                <div class="formulario-grupo">
                    <label for="codigo" data-i18n="verificar.codigo">Código de verificación</label>
                    <input type="text" id="codigo" name="codigo"
                           inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                           autocomplete="one-time-code" placeholder="000000"
                           required />
                </div>

                <button type="submit" class="btn-formulario" data-i18n="verificar.verificar">Verificar</button>
            </form>

            <p class="formulario-pie">
                <span data-i18n="verificar.noLlega">¿No te llega el correo?</span>
                <a href="#" id="btn-reenviar" data-i18n="verificar.reenviar">Reenviar código</a>
                <span id="reenvio-espera" hidden aria-live="polite"></span>
            </p>
        </div>
    </main>

    <div id="app-footer"></div>

    <script type="module" src="../js/header.js"></script>
    <script type="module" src="../js/verificar.js"></script>
</body>
</html>
